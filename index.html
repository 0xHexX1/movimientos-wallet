<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movimientos de Wallet</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: centered single column — controls on top, running list of money-in / money-out rows below */
  :root{
    --bg:#f5f7f9; --surface:#ffffff; --surface-2:#eef1f4; --border:#e3e7ec;
    --fg:#10151b; --muted:#5b6672;
    --accent:#0d9488; --accent-weak:rgba(13,148,136,.12);
    --in:#0f9d6b; --in-weak:rgba(15,157,107,.12);
    --out:#dc2626; --out-weak:rgba(220,38,38,.09);
    --warn:#b45309; --danger:#dc2626; --danger-weak:rgba(220,38,38,.1);
    --shadow:0 1px 2px rgba(16,21,27,.04),0 6px 20px rgba(16,21,27,.06);
    --font-display:'Sora',system-ui,sans-serif;
    --font-body:'Manrope',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0a0e13; --surface:#121820; --surface-2:#1a212b; --border:#263241;
    --fg:#e8edf2; --muted:#92a0ad;
    --accent:#2dd4bf; --accent-weak:rgba(45,212,191,.13);
    --in:#34d399; --in-weak:rgba(52,211,153,.13);
    --out:#f87171; --out-weak:rgba(248,113,113,.12);
    --warn:#f59e0b; --danger:#f87171; --danger-weak:rgba(248,113,113,.12);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0a0e13; --surface:#121820; --surface-2:#1a212b; --border:#263241;
    --fg:#e8edf2; --muted:#92a0ad;
    --accent:#2dd4bf; --accent-weak:rgba(45,212,191,.13);
    --in:#34d399; --in-weak:rgba(52,211,153,.13);
    --out:#f87171; --out-weak:rgba(248,113,113,.12);
    --warn:#f59e0b; --danger:#f87171; --danger-weak:rgba(248,113,113,.12);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  img{max-width:100%}
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;
    -webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
    background:var(--surface);z-index:20}

  .wrap{max-width:820px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:0 52px}

  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;
    background:var(--surface);border-bottom:1px solid var(--border);
    margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));
    margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px))}
  .head-in{display:flex;align-items:center;gap:12px;padding-block:13px;max-width:820px;margin:0 auto}
  .logo{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:var(--accent-weak);color:var(--accent)}
  .logo svg{width:20px;height:20px}
  h1{font-family:var(--font-display);font-size:1.1rem;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.1}
  .sub{font-size:.75rem;color:var(--muted);margin-top:1px}
  .theme-btn{margin-left:auto;flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .theme-btn:hover{color:var(--fg)}
  .theme-btn svg{width:17px;height:17px}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    box-shadow:var(--shadow);padding:18px;margin-top:20px}
  .field{display:flex;flex-direction:column;gap:7px}
  label.lbl,.lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  input[type=text]{width:100%;min-width:0;font-family:var(--font-mono);font-size:.86rem;
    padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--fg)}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}

  .row2{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px}
  .col{flex:1;min-width:210px;display:flex;flex-direction:column;gap:7px}

  .seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
  .seg button{flex:1;border:none;background:none;color:var(--muted);font-family:var(--font-body);
    font-size:.82rem;font-weight:600;padding:7px 4px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;
    border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;
    font-size:.8rem;font-weight:600;user-select:none}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
  .chip[aria-pressed=true]{border-color:var(--accent);color:var(--fg);background:var(--accent-weak)}
  .chip[aria-pressed=true] .dot{opacity:1}

  .go{margin-top:18px;width:100%;border:none;border-radius:11px;background:var(--accent);color:#ffffff;
    font-family:var(--font-display);font-size:.95rem;font-weight:600;padding:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px}
  .go:disabled{opacity:.6;cursor:default}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
    animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .status{font-size:.8rem;color:var(--muted);margin-top:12px;text-align:center;min-height:1.1em}

  /* summary */
  .summary{display:none;gap:10px;margin-top:22px;flex-wrap:wrap}
  .summary.on{display:flex}
  .stat{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .stat .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
  .stat .v{font-family:var(--font-display);font-size:1.4rem;font-weight:700;margin-top:4px;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat .sub2{font-size:.74rem;color:var(--muted);font-weight:600;margin-top:1px}
  .stat.in .v{color:var(--in)} .stat.out .v{color:var(--out)}
  .arrow{width:9px;height:9px;border-radius:50%}
  .arrow.i{background:var(--in)} .arrow.o{background:var(--out)}

  .suspbar{margin-top:12px;background:var(--danger-weak);border:1px solid var(--danger);border-radius:12px;
    padding:10px 14px;font-size:.8rem;color:var(--fg);display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
  .suspbar button{border:1px solid var(--danger);background:transparent;color:var(--danger);font-weight:700;
    border-radius:8px;padding:5px 13px;cursor:pointer;font-family:var(--font-body);font-size:.78rem;white-space:nowrap}
  .suspbar button:hover{background:var(--danger);color:#fff}

  /* view controls */
  .viewbar{display:none;gap:12px;margin-top:20px;flex-wrap:wrap;align-items:center}
  .viewbar.on{display:flex}
  .viewbar .seg{flex:0 0 auto}
  .search{flex:1;min-width:200px;position:relative}
  .search input{padding-left:34px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
  .copyall{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--fg);
    font-family:var(--font-body);font-weight:600;font-size:.82rem;padding:9px 13px;border-radius:10px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px}
  .copyall:hover{border-color:var(--accent);color:var(--accent)}
  .copyall svg{width:15px;height:15px}

  .list{margin-top:14px;display:flex;flex-direction:column;gap:9px}
  .daygroup{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
    margin:12px 2px 2px}

  .tx{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 15px;
    display:flex;align-items:center;gap:13px}
  .tx.scam{border-color:var(--danger)}
  .dirc{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center}
  .dirc svg{width:19px;height:19px}
  .dirc.i{background:var(--in-weak);color:var(--in)}
  .dirc.o{background:var(--out-weak);color:var(--out)}
  .mid{flex:1;min-width:0}
  .amt{font-family:var(--font-display);font-weight:700;font-size:1.12rem;font-variant-numeric:tabular-nums;
    letter-spacing:-.01em;line-height:1.15}
  .amt.i{color:var(--in)} .amt.o{color:var(--out)}
  .amt .tok{font-size:.76rem;color:var(--muted);font-weight:600;margin-left:3px}
  .who{font-size:.86rem;margin-top:2px}
  .who b{font-weight:700}
  .meta{font-size:.76rem;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .net-badge{display:inline-flex;align-items:center;gap:5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2)}
  .net-badge .d{width:7px;height:7px;border-radius:50%}
  .hash{font-family:var(--font-mono);font-size:.72rem}
  .mini{border:none;background:none;color:var(--muted);cursor:pointer;padding:2px;display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-family:var(--font-body);font-weight:600}
  .mini:hover{color:var(--accent)}
  .mini svg{width:13px;height:13px}
  .scam-tag{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;color:var(--danger);text-transform:uppercase}
  .right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .time{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .view{font-size:.76rem;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap}
  .view:hover{text-decoration:underline}

  .empty{text-align:center;padding:38px 20px;color:var(--muted);font-size:.9rem}
  .note{font-size:.74rem;color:var(--muted);margin-top:26px;text-align:center;line-height:1.6}
  .warnote{color:var(--warn);font-weight:600}
  a{color:var(--accent)}

  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
    background:var(--fg);color:var(--bg);font-weight:600;font-size:.84rem;padding:10px 18px;border-radius:999px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:440px){
    .tx{gap:11px;padding:11px}
    .dirc{width:36px;height:36px}
    .viewbar .seg{flex:1 1 100%}
    .copyall{flex:1 1 100%;justify-content:center}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="head-in">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13M3 7l4-4M3 7l4 4"/><path d="M21 17H8M21 17l-4-4M21 17l-4 4"/></svg>
      </div>
      <div>
        <h1>Movimientos de Wallet</h1>
        <div class="sub">Todo lo que entra y sale, en euros</div>
      </div>
      <button class="theme-btn" id="theme" title="Cambiar tema" aria-label="Cambiar tema"></button>
    </div>
  </header>

  <div class="panel">
    <div class="field">
      <label class="lbl" for="addr">Dirección de la wallet</label>
      <input type="text" id="addr" spellcheck="false" autocomplete="off" placeholder="0x…" />
    </div>

    <div class="row2">
      <div class="col">
        <span class="lbl">Periodo</span>
        <div class="seg" id="period" role="group" aria-label="Periodo">
          <button data-d="7" aria-pressed="false">7 días</button>
          <button data-d="30" aria-pressed="true">30 días</button>
          <button data-d="90" aria-pressed="false">90 días</button>
          <button data-d="0" aria-pressed="false">Todo</button>
        </div>
      </div>
      <div class="col">
        <span class="lbl">Redes</span>
        <div class="chips" id="nets"></div>
      </div>
    </div>

    <button class="go" id="go">Ver movimientos</button>
    <div class="status" id="status"></div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="suspbar" id="suspbar" hidden></div>

  <div class="viewbar" id="viewbar">
    <div class="seg" id="dir" role="group" aria-label="Tipo">
      <button data-f="all" aria-pressed="true">Todo</button>
      <button data-f="in" aria-pressed="false">Entradas</button>
      <button data-f="out" aria-pressed="false">Salidas</button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input type="text" id="q" spellcheck="false" autocomplete="off" placeholder="Filtrar por ID de transacción, dirección o plataforma" />
    </div>
    <button class="copyall" id="copyall">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      Copiar todo
    </button>
  </div>

  <div class="list" id="list"></div>
  <div class="note" id="note"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const NETWORKS = {
  eth:  {chainId:1,    name:'Ethereum', host:'https://eth.blockscout.com',      tx:'https://etherscan.io/tx/',       addr:'https://etherscan.io/address/',    native:'ETH', color:'#627EEA', on:true},
  base: {chainId:8453, name:'Base',     host:'https://base.blockscout.com',     tx:'https://basescan.org/tx/',       addr:'https://basescan.org/address/',    native:'ETH', color:'#0052FF', on:true},
  arb:  {chainId:42161,name:'Arbitrum', host:'https://arbitrum.blockscout.com', tx:'https://arbiscan.io/tx/',        addr:'https://arbiscan.io/address/',     native:'ETH', color:'#12AAFF', on:false},
  poly: {chainId:137,  name:'Polygon',  host:'https://polygon.blockscout.com',  tx:'https://polygonscan.com/tx/',    addr:'https://polygonscan.com/address/', native:'POL', color:'#8247E5', on:false},
  zks:  {chainId:324,  name:'zkSync',   host:'https://zksync.blockscout.com',   tx:'https://era.zksync.network/tx/', addr:'https://era.zksync.network/address/', native:'ETH', color:'#1E69FF', on:false},
};
const DEFAULT_ADDR = '';
const KNOWN = {
  '0x7830c87c02e56aff27fa8ab1241711331fa86f43':'Coinbase',
  '0xa9d1e08c7793af67e9d92fe308d5697fb81d3e43':'Coinbase',
  '0x28c6c06298d514db089934071355e5743bf21d60':'Binance',
  '0x21a31ee1afc51d94c2efccaa2092ad1028285549':'Binance',
  '0xf977814e90da44bfa03b6295a0616a897441acec':'Binance',
  '0xf89d7b9c864f589bbf53a82105107622b35eaa40':'Bybit',
};

let eurRate = 0.92;
const coinPrice = {};
let ALL = [];
let dirFilter = 'all';
let showSuspect = false;
const $ = s=>document.querySelector(s);
const esEUR = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const esUSD = new Intl.NumberFormat('es-ES',{style:'currency',currency:'USD',maximumFractionDigits:2});

/* theme */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
function curTheme(){const a=document.documentElement.getAttribute('data-theme');if(a)return a;
  return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);$('#theme').innerHTML=t==='dark'?SUN:MOON;
  try{localStorage.setItem('ws_theme',t)}catch(e){}}
(function(){let t;try{t=localStorage.getItem('ws_theme')}catch(e){}
  if(t)setTheme(t);else $('#theme').innerHTML=curTheme()==='dark'?SUN:MOON;})();
$('#theme').onclick=()=>setTheme(curTheme()==='dark'?'light':'dark');

/* chips */
const netBox=$('#nets');
for(const [k,n] of Object.entries(NETWORKS)){
  const b=document.createElement('button');
  b.className='chip';b.dataset.k=k;b.setAttribute('aria-pressed',n.on);
  b.innerHTML='<span class="dot" style="color:'+n.color+'"></span>'+n.name;
  b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');
  netBox.appendChild(b);
}
/* period */
let days=30;
$('#period').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  days=+b.dataset.d;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));});
/* direction filter */
$('#dir').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  dirFilter=b.dataset.f;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));filterAndRender();});
$('#q').addEventListener('input',filterAndRender);

/* persistence */
try{const sv=localStorage.getItem('ws_addr');$('#addr').value=sv||DEFAULT_ADDR;}catch(e){$('#addr').value=DEFAULT_ADDR;}

/* helpers */
function parseTs(s){if(!s)return NaN;return Date.parse(s.replace(/\.(\d{3})\d*/,'.$1'));}
async function getJSON(url,ms=20000){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json();}
  finally{clearTimeout(t);}
}
function platformLabel(acct){
  if(!acct)return null;
  const tags=(acct.metadata&&acct.metadata.tags)||[];
  for(const t of tags){if(t.meta&&t.meta.main_entity)return t.meta.main_entity;}
  for(const t of tags){if(t.tagType==='name'&&t.name)return t.name;}
  for(const t of tags){if(t.tagType==='protocol'&&t.name)return t.name;}
  if(acct.name)return acct.name;
  if(acct.ens_domain_name)return acct.ens_domain_name;
  if(acct.hash&&KNOWN[acct.hash.toLowerCase()])return KNOWN[acct.hash.toLowerCase()];
  for(const t of tags){if(t.name)return t.name;}
  return null;
}
function isScam(acct,token){
  if(acct&&acct.is_scam)return true;
  if(token&&token.reputation==='scam')return true;
  return false;
}
function short(a){return a?a.slice(0,6)+'…'+a.slice(-4):'';}
function fmtAmt(n){return n.toLocaleString('es-ES',{maximumFractionDigits:n>=1?2:6,minimumFractionDigits:n>=1?2:0});}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* A movement is "suspect" (fake / worthless / address-poisoning scam token) when:
   its symbol has non-ASCII lookalike or invisible chars, it is flagged scam,
   or it is a token with no market price (no € value). Native coin is always real. */
function weird(s){return /[^\x20-\x7E]/.test(s||'');}
function suspect(r){
  if(r.scam)return true;
  if(weird(r.symbol))return true;
  if(r.usd==null && r.symbol!==NETWORKS[r.net].native)return true;
  return false;
}

async function fetchList(net,addr,path,extra,cutoff,maxPages){
  const all=[];let page={};
  for(let p=0;p<maxPages;p++){
    const q=new URLSearchParams(extra);
    for(const [k,v] of Object.entries(page))q.set(k,v);
    let j;
    try{j=await getJSON(net.host+'/api/v2/addresses/'+addr+'/'+path+'?'+q);}catch(e){break;}
    if(!j||!Array.isArray(j.items))break;
    all.push(...j.items);
    const last=j.items[j.items.length-1];
    const lt=last?parseTs(last.timestamp):NaN;
    if(cutoff&&lt&&lt<cutoff)break;
    if(!j.next_page_params)break;
    page=j.next_page_params;
  }
  return all;
}
async function loadCoinPrice(net){
  if(coinPrice[net.chainId]!==undefined)return;
  try{const s=await getJSON(net.host+'/api/v2/stats',9000);
    coinPrice[net.chainId]=s&&s.coin_price?Number(s.coin_price):null;}
  catch(e){coinPrice[net.chainId]=null;}
}

async function scanNetwork(key,addr,cutoff){
  const net=NETWORKS[key];const low=addr.toLowerCase();const rows=[];
  const bigPages=cutoff?8:14;
  await loadCoinPrice(net);
  // token transfers, BOTH directions
  const toks=await fetchList(net,addr,'token-transfers',{type:'ERC-20'},cutoff,bigPages);
  for(const it of toks){
    const ts=parseTs(it.timestamp);if(cutoff&&ts<cutoff)continue;
    const toA=it.to&&it.to.hash.toLowerCase(), frA=it.from&&it.from.hash.toLowerCase();
    let dir=null;if(toA===low)dir='in';else if(frA===low)dir='out';else continue;
    const dec=Number((it.total&&it.total.decimals)??(it.token&&it.token.decimals)??18);
    const amt=Number((it.total&&it.total.value)||0)/10**dec;if(!amt)continue;
    const rate=it.token&&it.token.exchange_rate?Number(it.token.exchange_rate):null;
    const counter=dir==='in'?it.from:it.to;
    rows.push({net:key,ts,hash:it.transaction_hash,dir,amount:amt,
      symbol:(it.token&&(it.token.symbol||it.token.name))||'?',
      icon:it.token&&it.token.icon_url,usd:rate?amt*rate:null,
      counter,plat:platformLabel(counter),scam:isScam(counter,it.token)});
  }
  // native coin, BOTH directions (value > 0 only)
  const nat=await fetchList(net,addr,'transactions',{},cutoff,cutoff?4:7);
  for(const it of nat){
    if(it.status&&it.status!=='ok')continue;
    const amt=Number(it.value||0)/1e18;if(!amt)continue;
    const ts=parseTs(it.timestamp);if(cutoff&&ts<cutoff)continue;
    const toA=it.to&&it.to.hash.toLowerCase(), frA=it.from&&it.from.hash.toLowerCase();
    let dir=null;if(toA===low)dir='in';else if(frA===low)dir='out';else continue;
    const pr=coinPrice[net.chainId];const counter=dir==='in'?it.from:it.to;
    rows.push({net:key,ts,hash:it.hash,dir,amount:amt,symbol:net.native,icon:null,
      usd:pr?amt*pr:null,counter,plat:platformLabel(counter),scam:isScam(counter,null)});
  }
  return rows;
}

/* ---- rendering ---- */
function dayKey(ts){return new Date(ts).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function eur(r){return r.usd!=null?r.usd*eurRate:null;}
function matchQ(r,q){
  if(!q)return true;q=q.toLowerCase();
  return (r.hash&&r.hash.toLowerCase().includes(q))
    || (r.counter&&r.counter.hash&&r.counter.hash.toLowerCase().includes(q))
    || (r.plat&&r.plat.toLowerCase().includes(q))
    || (r.symbol&&r.symbol.toLowerCase().includes(q));
}
function currentRows(){
  const q=$('#q').value.trim();
  const base = showSuspect ? ALL : ALL.filter(r=>!suspect(r));
  return base.filter(r=>(dirFilter==='all'||r.dir===dirFilter)&&matchQ(r,q)).sort((a,b)=>b.ts-a.ts);
}
const ARR_IN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>';
const ARR_OUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>';
const CP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

function render(){
  const list=$('#list'),note=$('#note');list.innerHTML='';
  const rows=currentRows();
  if(!rows.length){
    list.innerHTML='<div class="empty">No hay movimientos con estos filtros.<br>Prueba a cambiar el periodo, el tipo o el texto de búsqueda.</div>';
    note.innerHTML=baseNote();return;
  }
  let curDay='';
  rows.forEach(r=>{
    const dk=dayKey(r.ts);
    if(dk!==curDay){curDay=dk;const h=document.createElement('div');h.className='daygroup';h.textContent=dk;list.appendChild(h);}
    const n=NETWORKS[r.net];const e=eur(r);
    const main=e!=null?(r.dir==='in'?'+':'−')+esEUR.format(e).replace('-','') : (r.dir==='in'?'+':'−')+fmtAmt(r.amount)+' '+esc(r.symbol);
    const tok=e!=null?'<span class="tok">'+fmtAmt(r.amount)+' '+esc(r.symbol)+'</span>':'';
    const who=r.dir==='in'
      ? 'Entró de <b>'+esc(r.plat||'Desconocido')+'</b>'
      : 'Salió hacia <b>'+esc(r.plat||'Desconocido')+'</b>';
    const sus=suspect(r);
    const time=new Date(r.ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    const el=document.createElement('div');
    el.className='tx'+(sus?' scam':'');
    el.innerHTML=
      '<div class="dirc '+(r.dir==='in'?'i':'o')+'">'+(r.dir==='in'?ARR_IN:ARR_OUT)+'</div>'+
      '<div class="mid">'+
        '<div class="amt '+(r.dir==='in'?'i':'o')+'">'+main+' '+tok+'</div>'+
        '<div class="who">'+(sus?'<span class="scam-tag">⚠ Token falso / sin valor</span> ':'')+who+'</div>'+
        '<div class="meta">'+
          '<span class="net-badge"><span class="d" style="background:'+n.color+'"></span>'+n.name+'</span>'+
          '<span class="hash">'+short(r.hash)+'</span>'+
          '<button class="mini" data-copy="'+esc(r.hash)+'" title="Copiar ID de transacción">'+CP+'ID</button>'+
          '<button class="mini" data-copy="'+esc(r.counter?r.counter.hash:'')+'" title="Copiar dirección">'+CP+'Dirección</button>'+
        '</div>'+
      '</div>'+
      '<div class="right">'+
        '<span class="time">'+time+'</span>'+
        '<a class="view" href="'+n.tx+r.hash+'" target="_blank" rel="noopener">Ver ↗</a>'+
        '<button class="mini" data-copyline="1" title="Copiar este movimiento">'+CP+'Copiar</button>'+
      '</div>';
    el._row=r;
    list.appendChild(el);
  });
  note.innerHTML=baseNote();
}

function summarize(){
  const sum=$('#summary');
  const real=ALL.filter(r=>!suspect(r));
  let inU=0,outU=0,inN=0,outN=0;
  real.forEach(r=>{const e=eur(r);
    if(r.dir==='in'){inN++; if(e!=null)inU+=e;}
    else{outN++; if(e!=null)outU+=e;}});
  const bal=inU-outU;
  sum.className='summary on';
  sum.innerHTML=
    '<div class="stat in"><div class="k"><span class="arrow i"></span>Entró</div><div class="v">+'+esEUR.format(inU).replace('-','')+'</div><div class="sub2">'+inN+' movimiento(s)</div></div>'+
    '<div class="stat out"><div class="k"><span class="arrow o"></span>Salió</div><div class="v">−'+esEUR.format(outU).replace('-','')+'</div><div class="sub2">'+outN+' movimiento(s)</div></div>'+
    '<div class="stat"><div class="k">Balance</div><div class="v">'+(bal>=0?'+':'−')+esEUR.format(Math.abs(bal))+'</div><div class="sub2">entradas − salidas</div></div>';
  const sN=ALL.length-real.length;
  const sb=$('#suspbar');
  if(sN){sb.hidden=false;
    sb.innerHTML='<span>⚠ Se '+(showSuspect?'muestran':'han ocultado')+' <b>'+sN+'</b> movimiento(s) de tokens falsos o sin valor (posible estafa de <i>address poisoning</i>).</span> <button id="suspbtn">'+(showSuspect?'Ocultar':'Mostrar')+'</button>';
    $('#suspbtn').onclick=()=>{showSuspect=!showSuspect;summarize();render();};}
  else sb.hidden=true;
  $('#viewbar').className='viewbar on';
}
function filterAndRender(){render();}

function baseNote(){
  return 'Datos públicos de la blockchain vía Blockscout (lo mismo que ves en Etherscan y Basescan). Importes en € al cambio actual (aprox.). No incluye las comisiones de red (gas).';
}

/* ---- copy ---- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600);}
function copyText(str){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(()=>toast('Copiado')).catch(()=>fallbackCopy(str));
  }else fallbackCopy(str);
}
function fallbackCopy(str){
  const ta=document.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Copiado');}catch(e){toast('No se pudo copiar');}
  document.body.removeChild(ta);
}
function lineFor(r){
  const n=NETWORKS[r.net];const e=eur(r);
  const d=new Date(r.ts).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const tipo=r.dir==='in'?'Entrada':'Salida';
  const sign=r.dir==='in'?'+':'−';
  const euros=e!=null?sign+esEUR.format(Math.abs(e)):'';
  const quien=(r.dir==='in'?'de ':'a ')+(r.plat||short(r.counter&&r.counter.hash));
  return d+' · '+tipo+' '+euros+' ('+sign+fmtAmt(r.amount)+' '+r.symbol+') '+quien+' · '+n.name+' · '+n.tx+r.hash;
}
function tsvAll(){
  const rows=currentRows();
  const head=['Fecha','Hora','Tipo','Importe (token)','Token','Euros (aprox)','Contraparte','Plataforma','Red','ID transacción','Enlace'].join('\t');
  const lines=rows.map(r=>{
    const n=NETWORKS[r.net];const e=eur(r);const dt=new Date(r.ts);
    return [
      dt.toLocaleDateString('es-ES'),
      dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),
      r.dir==='in'?'Entrada':'Salida',
      (r.dir==='in'?'+':'-')+fmtAmt(r.amount),
      r.symbol,
      e!=null?(r.dir==='in'?'+':'-')+e.toFixed(2).replace('.',','):'',
      r.counter?r.counter.hash:'',
      r.plat||'',
      n.name,
      r.hash,
      n.tx+r.hash
    ].join('\t');
  });
  return [head].concat(lines).join('\n');
}
$('#copyall').onclick=()=>{const t=tsvAll();if(!t||t.split('\n').length<2){toast('Nada que copiar');return;}copyText(t);};
$('#list').addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');
  if(cp){const v=cp.getAttribute('data-copy');if(v)copyText(v);return;}
  const cl=e.target.closest('[data-copyline]');
  if(cl){const tx=cl.closest('.tx');if(tx&&tx._row)copyText(lineFor(tx._row));return;}
});

/* ---- run ---- */
let running=false;
async function run(){
  if(running)return;
  const addr=$('#addr').value.trim();
  if(!/^0x[0-9a-fA-F]{40}$/.test(addr)){
    $('#status').innerHTML='<span style="color:var(--danger)">Dirección no válida. Debe empezar por 0x y tener 42 caracteres.</span>';return;
  }
  try{localStorage.setItem('ws_addr',addr);}catch(e){}
  const keys=[...document.querySelectorAll('#nets .chip')].filter(c=>c.getAttribute('aria-pressed')==='true').map(c=>c.dataset.k);
  if(!keys.length){$('#status').textContent='Selecciona al menos una red.';return;}

  running=true;
  const go=$('#go');go.disabled=true;go.innerHTML='<span class="spin"></span>Cargando…';
  $('#viewbar').className='viewbar on';$('#list').innerHTML='';$('#note').innerHTML='';
  const cutoff=days?Date.now()-days*86400000:0;

  try{const fx=await getJSON('https://open.er-api.com/v6/latest/USD',7000);
    if(fx&&fx.rates&&fx.rates.EUR)eurRate=fx.rates.EUR;}catch(e){}

  ALL=[];const failed=[];
  for(const k of keys){
    $('#status').textContent='Consultando '+NETWORKS[k].name+'…';
    try{const rows=await scanNetwork(k,addr,cutoff);ALL.push(...rows);}
    catch(e){failed.push(NETWORKS[k].name);}
  }
  $('#status').textContent=failed.length?('No se pudo consultar: '+failed.join(', ')):'';
  summarize();render();
  go.disabled=false;go.textContent='Ver movimientos';running=false;
}
$('#go').onclick=run;
$('#addr').addEventListener('keydown',e=>{if(e.key==='Enter')run();});

if($('#addr').value.trim())run();
</script>
